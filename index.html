<style>

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}

.mode .ic{font-size:36px}

.card{background:var(--card);border-radius:24px;padding:22px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.big{font-size:40px;font-weight:800;text-align:center;letter-spacing:.5px}

ikes listening to rock music."}},{"id":38,"w":"save","ph":"/seɪv/","o":{"m":"v. 拯救","s":"He saved the little girl from the river."},"r":{"m":"v. 节省","s":"We should save water every day."}},{"id":39,"w":"sound","ph":"/saʊnd/","o":{"m":"n. 声音","s":"We heard a strange sound outside."},"r":{"m":"adj. 健康的","s":"He is in sound health."}},{"id":40,"w":"spring","ph":"/sprɪŋ/","o":{"m":"n. 春天","s":"Spring is a beautiful season."},"r":{"m":"n. 泉水","s":"There is a spring in the mountain."}},{"id":41,"w":"stand","ph":"/stænd/","o":{"m":"v. 站立","s":"Stand up when the teacher comes in."},"r":{"m":"n. 摊位","s":"There is a fruit stand near our school."}},{"id":42,"w":"taste","ph":"/teɪst/","o":{"m":"v. 品尝","s":"Taste the soup and see if it's salty."},"r":{"m":"n. 味道","s":"The cake has a sweet taste."}},{"id":43,"w":"trip","ph":"/trɪp/","o":{"m":"n. 旅行","s":"We had a great trip to the mountains."},"r":{"m":"v. 绊倒","s":"He tripped over a stone and fell down."}},{"id":44,"w":"water","ph":"/ˈwɔːtə(r)/","o":{"m":"n. 水","s":"We should drink enough water every day."},"r":{"m":"v. 浇水","s":"My mother waters the flowers every morning."}},{"id":45,"w":"watch","ph":"/wɒtʃ/","o":{"m":"n. 手表","s":"I wear a watch to tell the time."},"r":{"m":"v. 留意；小心","s":"Watch out for the cars when you cross the street."}},{"id":46,"w":"well","ph":"/wel/","o":{"m":"adv. 好","s":"She sings very well."},"r":{"m":"n. 井","s":"There is an old well in the village."}}];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 例句中高亮目标词（处理 break→broke 这类变形）
function hl(e){
  const alt={break:'broke'}[e.w]; const base=e.w.replace(/[^a-z]/gi,'');
  const re=new RegExp('\\b('+base+(alt?'|'+alt:'')+')\\w*','i');
  return esc(e.s).replace(re,m=>'<mark>'+m+'</mark>');
}
function tok(e){
  const alt={break:'broke'}[e.w],base=e.w.replace(/[^a-z]/gi,'');
  const m=e.s.match(new RegExp('\\b('+base+(alt?'|'+alt:'')+')\\w*','i'));
  return m?m[0]:e.w;
}

// 音效（Web Audio 合成，无需外部文件）
let AC;
function tone(f,d=.12,type='sine'){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=.08;
    o.connect(g);g.connect(AC.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
    o.stop(AC.currentTime+d);
  }catch(e){}
}

}

function addStars(n){S.stars+=n;save()}

function topbar(back=true,title=''){
  return `<div class="top">${back?'<button class="back" onclick="home()">← 返回</button>':'<span></span>'}<b>${title}</b><span class="pill">⭐ ${S.stars}</span></div>`;
}
// 优先抽取未掌握的词义
function weightedPick(list,n){
  return shuffle(list).sort((a,b)=>
    ((S.mastery[a.key]||0)-(S.mastery[b.key]||0))+(Math.random()-.5)*1.5
  ).slice(0,n);
}

// ---------- 首页 ----------
function home(){
  const m=mastered(),pct=Math.round(m/ENT.length*100);
  const rank=m<10?'🌱 单词小苗':m<30?'🌿 词汇学徒':m<60?'🌳熟词达人':'🏆 僻义大师';
  app.innerHTML=topbar(false)+`
  <div class="mascot">🦉</div><h1>熟词僻义乐园</h1>
  <p class="tag">初一英语 · ${DATA.length} 个熟词 · 轻松玩，慢慢记，没有倒计时</p>
  <div class="prog"><b>${rank}</b><span style="float:right;color:var(--sub)">已掌握 ${m}/${ENT.length} 个词义</span><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="grid">
   <button class="mode" onclick="learn()"><div class="ic">🃏</div><b>翻翻卡片</b><small>先熟悉每个词的两种意思</small></button>
   <button class="mode" onclick="quiz()"><div class="ic">🎯</div><b>句子选义</b><small>看例句，选出正确意思</small></button>
   <button class="mode" onclick="match()"><div class="ic">🧩</div><b>配对消消乐</b><small>单词和中文连一连</small></button>
   <button class="mode" onclick="wordbook()"><div class="ic">📖</div><b>完整词表</b><small>92 条释义，随时检索</small></button>
   <button class="mode" onclick="quiz(true)"><div class="ic">📒</div><b>错题本 (${S.wrong.length})</b><small>${S.wrong.length?'把弄错的再练一遍':'目前没有错题，真棒'}</small></button>
   <button class="mode" onclick="spell()"><div class="ic">✍️</div><b>拼写填空</b><small>把空缺的单词拼出来</small></button>
  </div>
  <p class="small">每个词义答对 2 次就算"掌握"。进度自动保存在本机浏览器。</p>
  <button class="link" onclick="if(confirm('确定清空所有进度吗？')){S={stars:0,mastery:{},wrong:[],played:0};save();home()}">重置进度</button>`;
}

// ---------- 翻卡 ----------
let li=0;
function learn(i=li){
  li=(i+DATA.length)%DATA.length;
  const d=DATA[li];
  const sense=t=>{
    const e=ENTK[d.id+t];
    return `<div class="sense"><span class="lb ${t}">${TL[t]}</span><b>${esc(e.m)}</b><div class="s">${hl(e)}</div></div>`;
  };
  app.innerHTML=topbar(true,`${li+1} / ${DATA.length}`)+`
  <div class="flip" id="fl" onclick="this.classList.toggle('f')"><div class="in">
    <div class="face">
      <div class="big">${esc(d.w)}</div>
      <div class="ph">${esc(d.ph)}</div>
      <div style="text-align:center;margin-top:14px"><button class="sp" onclick="event.stopPropagation();say('${d.w}')">🔊</button></div>
      <p class="small">先想想它有哪两个意思？点卡片翻面 👆</p>
    </div>
    <div class="face b"><div class="big" style="font-size:30px">${esc(d.w)}</div>${sense('o')}${sense('r')}</div>
  </div></div>
  <div class="nav"><button class="btn sec" onclick="learn(li-1)">← 上一个</button><button class="btn" onclick="learn(li+1)">下一个 →</button></div>`;
}

// ---------- 句子选义 ----------
let Q,retry=()=>home();
function quiz(wrongMode=false){
  let pool=wrongMode?S.wrong.map(k=>ENTK[k]).filter(Boolean):ENT;
  if(!pool.length){
    if(wrongMode){alert('错题本是空的，先去挑战一下吧！');return}
    pool=ENT;
  }
  retry=()=>quiz(wrongMode);
  Q={list:weightedPick(pool,Math.min(10,pool.length)),i:0,right:0,combo:0,miss:[],gain:0,wm:wrongMode};
  quizQ();
}
function quizQ(){
  const e=Q.list[Q.i],d=byId[e.id],other=ENTK[e.id+(e.t==='o'?'r':'o')];
  const others=shuffle(ENT.filter(x=>x.id!==e.id)).slice(0,2);
  const opts=shuffle([e,other,...others]);
  app.innerHTML=topbar(true,`第 ${Q.i+1} / ${Q.list.length} 题`)+`
  <div class="bar" style="margin:0 0 14px"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
  <div class="card">
    <div class="q" style="display:flex;align-items:center;justify-content:center;gap:8px">
      句子里的 <b>${esc(d.w)}</b> 是什么意思？
      <button class="sp" style="width:34px;height:34px;font-size:16px" onclick="say('${d.w}')">🔊</button>
    </div>
    <div class="sent">${hl(e)}</div>
  </div>
  <div class="opts" id="opts">${opts.map(o=>`<button class="opt" data-k="${o.key}" onclick="ans(this)">${esc(o.m)}</button>`).join('')}</div>
  <div id="fb"></div>`;
}
function ans(btn){
  const e=Q.list[Q.i],k=btn.dataset.k,ok=k===e.key,d=byId[e.id];
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.k===e.key)b.classList.add('ok');
  });
  const r=btn.getBoundingClientRect();
  if(ok){
    sfx.ok();Q.right++;Q.combo++;
    let g=1+(Q.combo>=3?1:0);Q.gain+=g;addStars(g);
    pop(r.left+r.width/2,r.top,'⭐'.repeat(g));
    S.mastery[e.key]=(S.mastery[e.key]||0)+1;
    S.wrong=S.wrong.filter(x=>x!==e.key);
    save();
    if(Q.combo>=3)comboMsg(Q.combo);
  }else{
    btn.classList.add('no');sfx.no();Q.combo=0;Q.miss.push(e);
    S.mastery[e.key]=Math.max(0,(S.mastery[e.key]||0)-1);
    if(!S.wrong.includes(e.key))S.wrong.push(e.key);
    save();
  }
  const sn=t=>{
    const x=ENTK[d.id+t];
    return `<div style="margin-top:4px"><span class="lb ${t}" style="display:inline-block;font-size:12px;color:#fff;padding:0 8px;border-radius:99px;background:var(${t==='o'?'--blue':'--pri'})">${TL[t]}</span> ${esc(x.m)}</div>`;
  };
  $('#fb').innerHTML=`<div class="fb"><div class="t">${ok?rnd(['答对啦！👏','太棒了！🎉','没错！✨','你真厉害！💪']):rnd(['没关系，记住它就赢啦 🌈','差一点点！下次一定 💡','这就是"僻义"的陷阱 😉'])}</div>
  <b>${esc(d.w)}</b> ${esc(d.ph)}${sn('o')}${sn('r')}</div>
  <button class="btn" onclick="nextQ()">${Q.i+1<Q.list.length?'下一题 →':'看结果 🎁'}</button>`;
}
function nextQ(){
  Q.i++;
  Q.i<Q.list.length?quizQ():result(Q.right,Q.list.length,Q.gain,Q.miss);
}

// ---------- 配对消消乐 ----------
let M;
function match(){
  const ws=shuffle(DATA).slice(0,6).map(d=>ENTK[d.id+rnd(['o','r'])]);
  retry=match;
  M={left:shuffle(ws),right:shuffle(ws),sel:null,done:0,miss:0,missE:[]};
  drawMatch();
}
function drawMatch(){
  app.innerHTML=topbar(true,'配对消消乐')+
  `<p class="tag">先点英文，再点它对应的中文意思</p>
   <div class="mt">
     <div style="display:grid;gap:10px">${M.left.map(e=>`<button class="tile" data-s="L" data-k="${e.key}" onclick="tp(this)">${esc(e.w)}<small>${TL[e.t]}</small></button>`).join('')}</div>
     <div style="display:grid;gap:10px">${M.right.map(e=>`<button class="tile" data-s="R" data-k="${e.key}" onclick="tp(this)">${esc(e.m)}</button>`).join('')}</div>
   </div>`;
}
function tp(b){
  if(b.classList.contains('done'))return;
  if(!M.sel||M.sel.dataset.s===b.dataset.s){
    if(M.sel)M.sel.classList.remove('sel');
    M.sel=b;b.classList.add('sel');
    if(b.dataset.s==='L')say(ENTK[b.dataset.k].w);
    return;
  }
  const a=M.sel;M.sel=null;a.classList.remove('sel');
  if(a.dataset.k===b.dataset.k){
    sfx.ok();
    [a,b].forEach(x=>x.classList.add('done'));
    const r=b.getBoundingClientRect();pop(r.left,r.top);addStars(1);
    S.mastery[a.dataset.k]=(S.mastery[a.dataset.k]||0)+1;save();M.done++;
    if(M.done===6)setTimeout(()=>result(6,6+M.miss,6,M.missE,'配对完成！'),500);
  }else{
    sfx.no();M.miss++;
    [a,b].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400)});
    const e=ENTK[a.dataset.s==='L'?a.dataset.k:b.dataset.k];
    if(!M.missE.includes(e))M.missE.push(e);
  }
}

// ---------- 拼写填空 ----------
let P;
function spell(){
  retry=spell;
  P={list:weightedPick(ENT,10),i:0,right:0,combo:0,miss:[],gain:0,hint:0,done:false};
  spellQ();
}
function spellQ(){
  const e=P.list[P.i],t=tok(e);P.hint=0;P.done=false;
  const re=new RegExp('\\b'+t+'\\b','i');
  const blank='<span class="blank">'+'&nbsp;'.repeat(Math.max(4,t.length))+'</span>';
  const shown=esc(e.s).replace(re,blank);
  const infl=t.toLowerCase()!==e.w.toLowerCase();
  app.innerHTML=topbar(true,`第 ${P.i+1} / ${P.list.length} 题`)+`
  <div class="bar" style="margin:0 0 14px"><i style="width:${P.i/P.list.length*100}%"></i></div>
  <div class="card">
    <div class="q">根据中文意思，把句子里的空填完整</div>
    <div style="text-align:center;margin:6px 0">
      <span class="lb ${e.t}" style="display:inline-block;font-size:12px;font-weight:800;padding:1px 9px;border-radius:99px;color:#fff;background:var(${e.t==='o'?'--blue':'--pri'})">${TL[e.t]}</span>
      <b style="font-size:20px">${esc(e.m)}</b>
    </div>
    <div class="sent">${shown}</div>
    <div class="q">${t.length} 个字母${infl?'，注意词形变化（原形 '+esc(e.w)+'）':''}</div>
  </div>
  <input class="inp" id="in" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="在这里输入…">
  <div class="row" id="ac"><button class="btn sec" onclick="spHint()">💡 提示一个字母</button><button class="btn" onclick="spCheck()">确定</button></div>
  <div id="fb"></div>`;
  const inp=$('#in');inp.focus();
  inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')P.done?spNext():spCheck()});
}
function spHint(){
  if(P.done)return;
  const t=tok(P.list[P.i]);
  P.hint=Math.min(t.length-1,P.hint+1);
  const inp=$('#in');inp.value=t.slice(0,P.hint);inp.focus();
}
function spCheck(){
  if(P.done)return;
  const e=P.list[P.i],t=tok(e),inp=$('#in'),v=inp.value.trim();
  if(!v){inp.focus();return}
  P.done=true;inp.disabled=true;
  const ok=v.toLowerCase()===t.toLowerCase(),d=byId[e.id];
  if(ok){
    sfx.ok();inp.classList.add('ok');P.right++;P.combo++;
    let g=P.hint?1:2;if(P.combo>=3)g++;
    Q=P;P.gain+=g;addStars(g);
    if(!P.hint)S.mastery[e.key]=(S.mastery[e.key]||0)+1;
    S.wrong=S.wrong.filter(x=>x!==e.key);save();
    if(P.combo>=3)comboMsg(P.combo);
    const r=inp.getBoundingClientRect();pop(r.left+r.width/2,r.top,'⭐'.repeat(g));
  }else{
    sfx.no();inp.classList.add('no');P.combo=0;P.miss.push(e);
    S.mastery[e.key]=Math.max(0,(S.mastery[e.key]||0)-1);
    if(!S.wrong.includes(e.key))S.wrong.push(e.key);
    save();
  }
  $('#ac').style.display='none';
  $('#fb').innerHTML=`<div class="fb"><div class="t">${ok?(P.hint?'拼对了！下次不用提示更棒 👍':rnd(['拼对啦！👏','完全正确！🎉','一个字母都没错 ✨'])):'正确拼写：<span style="color:var(--ok);font-size:20px">'+esc(t)+'</span> 🌈'}</div>
  <b>${esc(d.w)}</b> ${esc(d.ph)}<div class="s" style="margin-top:6px">${hl(e)}</div></div>
  <button class="btn" id="nx" onclick="spNext()">${P.i+1<P.list.length?'下一题 →':'看结果 🎁'}</button>`;
  $('#nx').focus();
}
function spNext(){
  P.i++;
  P.i<P.list.length?spellQ():result(P.right,P.list.length,P.gain,P.miss);
}

// ---------- 完整词表 ----------
let WB={q:'',f:'all'};
const isMastered=d=>(S.mastery[d.id+'o']||0)>=2&&(S.mastery[d.id+'r']||0)>=2;
const isWrong=d=>S.wrong.includes(d.id+'o')||S.wrong.includes(d.id+'r');

function wordbook(){
  const draw=()=>{
    const kw=WB.q.trim().toLowerCase();
    // 关键词：匹配单词/音标/两义/两例句
    const matchKw=d=>!kw||
      d.w.toLowerCase().includes(kw)||d.ph.toLowerCase().includes(kw)||
      d.o.m.toLowerCase().includes(kw)||d.r.m.toLowerCase().includes(kw)||
      d.o.s.toLowerCase().includes(kw)||d.r.s.toLowerCase().includes(kw);
    // 类型筛选：rare=释义命中僻义，common=释义命中原义
    const matchType=d=>{
      if(WB.f==='rare')return d.r.m.toLowerCase().includes(kw);
      if(WB.f==='common')return d.o.m.toLowerCase().includes(kw);
      if(WB.f==='mastered')return isMastered(d);
      if(WB.f==='wrong')return isWrong(d);
      return true;
    };
    const list=DATA.filter(d=>matchKw(d)&&matchType(d));
    const total=ENT.filter(e=>(S.mastery[e.key]||0)>=2).length;
    const chips=[
      ['all','全部',DATA.length],
      ['rare','僻义释义',DATA.filter(d=>d.r.m.toLowerCase().includes(kw)).length],
      ['common','原义释义',DATA.filter(d=>d.o.m.toLowerCase().includes(kw)).length],
      ['mastered','已掌握',DATA.filter(isMastered).length],
      ['wrong','错题',DATA.filter(isWrong).length]
    ];
    app.innerHTML=topbar(true,'完整词表')+`
    <input class="search" id="wq" placeholder="搜索单词、音标、释义或例句…" value="${esc(WB.q)}">
    <div class="chips">${chips.map(c=>`<button class="chip ${WB.f===c[0]?'on':''}" onclick="wbFilter('${c[0]}')">${c[1]} ${c[2]}</button>`).join('')}</div>
    <div class="count">共 ${list.length} 个词 · ${total}/${ENT.length} 个词义已掌握</div>
    ${list.length?list.map(d=>{
      const m=isMastered(d);
      return `<div class="wgroup">
        <div class="whead">
          <span class="wno">${String(d.id).padStart(2,'0')}</span>
          <button style="flex:1;text-align:left;background:none" onclick="say('${d.w}')">
            <span class="wen">${esc(d.w)}</span><br><span class="wph">${esc(d.ph)}</span>
          </button>
          <span class="wstat ${m?'on':''}">${m?'✅':'⬜'}</span>
        </div>
        <div class="wbody">
          <div class="wm"><span class="lb o">原义</span>${esc(d.o.m)}</div>
          <div class="wex">${esc(d.o.s)}</div>
          <div class="wm"><span class="lb r">僻义</span>${esc(d.r.m)}</div>
          <div class="wex">${esc(d.r.s)}</div>
        </div>
      </div>`;
    }).join(''):'<div class="empty">没有匹配的词条<br><small>换个关键词试试</small></div>'}`;
    const inp=$('#wq');
    if(inp){
      inp.focus();
      inp.setSelectionRange(inp.value.length,inp.value.length);
      inp.addEventListener('input',e=>{
        WB.q=e.target.value;
        const p=inp.selectionStart;
        draw();
        const n=$('#wq');n.focus();n.setSelectionRange(p,p);
      });
    }
  };
  draw();
}
window.wbFilter=f=>{WB.f=f;wordbook()};

// ---------- 结果 ----------
function result(right,total,gain,miss,title){
  S.played++;save();sfx.win();
  const rate=total?right/total:0;
  const st=rate>=.9?'🌟🌟🌟':rate>=.6?'🌟🌟':'🌟';
  app.innerHTML=topbar(true,title||'本轮完成')+`
  <div class="card" style="text-align:center">
    <div class="stars">${st}</div>
    <div class="big" style="font-size:32px">${rate>=.9?'完美！':rate>=.6?'做得不错！':'继续加油！'}</div>
    <p>答对 <b>${right}</b> / ${total} · 本轮获得 ⭐ ${gain}</p>
    ${miss.length?`<div class="wl"><b>再看一眼这些词：</b>${miss.map(e=>`<div class="sense"><b>${esc(e.w)}</b> ${esc(e.ph)}<br><span class="lb ${e.t}">${TL[e.t]}</span>${esc(e.m)}<div class="s">${hl(e)}</div></div>`).join('')}</div>`:'<p>这一轮一个都没错 🎉</p>'}
  </div>
  <button class="btn" onclick="retry()">再来一轮</button>
  <button class="btn sec" onclick="home()">回首页</button>`;
}

home();
</script>
</body>
